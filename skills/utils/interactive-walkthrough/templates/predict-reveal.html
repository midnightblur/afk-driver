<!--
  predict-reveal — active-learning pause at a POINT OF LIKELY SURPRISE.
  Poses "what happens here?", makes the reader commit to a prediction (or just
  think), then reveals the actual behaviour + why. Ungraded, nothing recorded —
  distinct from a quiz question: it teaches at the moment of surprise instead
  of testing afterwards.

  DATA CONTRACT — fill IWP_DATA (one object):
    q      : the prediction prompt, e.g. "The request times out mid-write.
             What state is the record left in?"
    opts   : OPTIONAL array of 2-4 prediction options (buttons). Omit for the
             think-then-reveal form (a lone Reveal button).
    right  : index into opts of the actual behaviour — REQUIRED when opts given
    reveal : the actual behaviour (inline HTML — code, prose, a value)
    expl   : 1-3 sentences on WHY, especially why the tempting wrong
             prediction is wrong

  MULTIPLE INSTANCES: duplicate the .iwp div + its script block, give the div a
  unique id, rename IWP_DATA in that copy (e.g. IWP_DATA_2) and point the
  script's first line at the new id. Keep only ONE copy of the <style> block.
-->
<style>
  .iwp{--iw-bg:#ffffff;--iw-bg2:#f4f5f7;--iw-ink:#1c2025;--iw-ink2:#5b6470;
       --iw-line:#d8dce2;--iw-acc:#0b7285;--iw-warn:#b0831a;--iw-ok:#2b8a3e;
       border:1px dashed var(--iw-warn);border-radius:10px;background:var(--iw-bg2);
       padding:1rem 1.1rem;margin:1rem 0;font-size:.92rem;color:var(--iw-ink)}
  @media (prefers-color-scheme: dark){
    .iwp{--iw-bg:#181b20;--iw-bg2:#14161a;--iw-ink:#e6e9ee;--iw-ink2:#9aa3b0;
         --iw-line:#333a44;--iw-acc:#5cc3d6;--iw-warn:#d9ab4a;--iw-ok:#69c67a}}
  :root[data-theme="dark"] .iwp{--iw-bg:#181b20;--iw-bg2:#14161a;--iw-ink:#e6e9ee;
       --iw-ink2:#9aa3b0;--iw-line:#333a44;--iw-acc:#5cc3d6;--iw-warn:#d9ab4a;--iw-ok:#69c67a}
  :root[data-theme="light"] .iwp{--iw-bg:#ffffff;--iw-bg2:#f4f5f7;--iw-ink:#1c2025;
       --iw-ink2:#5b6470;--iw-line:#d8dce2;--iw-acc:#0b7285;--iw-warn:#b0831a;--iw-ok:#2b8a3e}
  .iwp-tag{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
       color:var(--iw-warn)}
  .iwp-q{font-weight:600;margin:.3rem 0 .6rem}
  .iwp-opts button{display:block;width:100%;text-align:left;margin:.3rem 0;padding:.45rem .8rem;
       background:var(--iw-bg);color:var(--iw-ink);border:1px solid var(--iw-line);
       border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem}
  .iwp-opts button:hover{border-color:var(--iw-acc)}
  .iwp-opts button.right{border-color:var(--iw-ok);color:var(--iw-ok)}
  .iwp-opts button.wrong{border-color:var(--iw-warn);color:var(--iw-warn)}
  .iwp-reveal-btn{background:var(--iw-bg);color:var(--iw-acc);border:1px solid var(--iw-acc);
       border-radius:8px;padding:.45rem 1.1rem;cursor:pointer;font:inherit;font-size:.88rem;margin-top:.2rem}
  .iwp-out{display:none;margin-top:.7rem;background:var(--iw-bg);border:1px solid var(--iw-line);
       border-radius:8px;padding:.75rem .9rem;overflow-x:auto}
  .iwp.done .iwp-out{display:block}
  .iwp-expl{margin:.5rem 0 0;color:var(--iw-ink2);font-size:.85rem;
       border-top:1px dashed var(--iw-line);padding-top:.5rem}
  @media (prefers-reduced-motion: no-preference){
    .iwp-out{transition:opacity .12s}}
</style>

<div class="iwp" id="iwp-demo">
  <span class="iwp-tag">Predict first</span>
  <div class="iwp-q"></div>
  <div class="iwp-opts"></div>
  <div class="iwp-out" aria-live="polite"></div>
</div>

<script>
(function(){
  // FILL ME — see data contract in the header comment. Sample (replace):
  const IWP_DATA = {
    q: 'The validation step throws on item 3 of 5. Which items are saved?',
    opts: ['All five', 'Items 1-2', 'None', 'Items 1-2 and 4-5'],
    right: 2,
    reveal: '<pre><code>None — the batch runs in one transaction.</code></pre>',
    expl: 'The tempting answer is "items 1-2", but the whole batch shares a transaction that rolls back on the first throw — partial saves are impossible by design.'
  };

  const root = document.getElementById('iwp-demo');
  root.querySelector('.iwp-q').textContent = IWP_DATA.q;
  const opts = root.querySelector('.iwp-opts');
  const out  = root.querySelector('.iwp-out');
  function reveal(){
    if (root.classList.contains('done')) return;
    root.classList.add('done');
    out.innerHTML = IWP_DATA.reveal + '<div class="iwp-expl">' + IWP_DATA.expl + '</div>';
    if (window.__annotate) window.__annotate(out);
  }
  if (Array.isArray(IWP_DATA.opts) && IWP_DATA.opts.length){
    IWP_DATA.opts.forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = o;
      b.addEventListener('click', () => {
        if (root.classList.contains('done')) return;
        b.classList.add(i === IWP_DATA.right ? 'right' : 'wrong');
        if (i !== IWP_DATA.right)
          opts.querySelectorAll('button')[IWP_DATA.right].classList.add('right');
        reveal();
      });
      opts.appendChild(b);
    });
  } else {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'iwp-reveal-btn';
    b.textContent = 'I have a prediction — reveal';
    b.addEventListener('click', reveal);
    opts.appendChild(b);
  }
})();
</script>
