# Tests and the plugin-source gates, on every pull request and every push to main.
# Both operating systems run the same steps; Windows runs them in Git Bash.
name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              choco install jq -y --no-progress
            else
              sudo apt-get update && sudo apt-get install -y jq
            fi
          fi
          jq --version

      - name: Install test dependencies
        # mcp 2 renamed FastMCP, which the tracker server still imports.
        run: python -m pip install pytest markdown-it-py "mcp<2" requests pyyaml

      - name: Set a git identity for test repositories
        run: |
          git config --global user.name "afk ci"
          git config --global user.email "ci@example.invalid"
          git --version

      - name: Unit tests
        run: python -m pytest scripts/tests -q

      - name: Hook smoke tests
        run: bash hooks/tests/hook-smoke.sh

      - name: Plugin-source gates
        env:
          GATE_CACHE_DISABLE: '1'
          GATE_METRICS_DISABLE: '1'
        run: |
          rc=0
          for gate in skill-registry native-contract genericity behavior-registry; do
            echo "::group::$gate"
            bash "hooks/$gate-gate.sh" || { echo "::error::$gate gate blocked"; rc=1; }
            echo "::endgroup::"
          done
          exit "$rc"
