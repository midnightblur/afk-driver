# Tests and the plugin-source gates, on every pull request and every push to main.
# Both operating systems run the same steps; Windows runs them in Git Bash.
name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install afk-python
        # The setup bootstrap, as a user runs it: the pinned uv and CPython, the locked packages
        # with the test extra, and no system Python.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File skills/afk/setup/scripts/bootstrap.ps1 install --test
            echo "$LOCALAPPDATA\\afk\\python\\afk-bin" >> "$GITHUB_PATH"
          else
            sh skills/afk/setup/scripts/bootstrap.sh install --test
            echo "${XDG_DATA_HOME:-$HOME/.local/share}/afk/python/afk-bin" >> "$GITHUB_PATH"
          fi

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              choco install jq -y --no-progress
            else
              sudo apt-get update && sudo apt-get install -y jq
            fi
          fi
          jq --version

      - name: Set a git identity for test repositories
        # Name and address tokens stay under 3 characters: the genericity gate treats longer ones as author handles.
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git --version

      - name: Unit tests
        run: afk-python -m pytest scripts/tests -q

      - name: Hook smoke tests
        run: bash hooks/tests/hook-smoke.sh

      - name: Plugin-source gates
        # The pre-commit runner, given the change's merge-base path set instead of the staged one.
        env:
          GATE_METRICS_DISABLE: '1'
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="HEAD^"
          fi
          bash hooks/plugin-source-gates.sh --range "$base" HEAD || { echo "::error::plugin-source gates blocked"; exit 1; }

      - name: Hook latency budgets (informational)
        # Shared runners are noisy: the budget table reports, it does not gate.
        continue-on-error: true
        run: |
          afk-python hooks/tests/bench-hooks.py --runs 5 --manifest hooks.json --budgets
          afk-python hooks/tests/bench-hooks.py --runs 5 --manifest hooks.codex.json --budgets
